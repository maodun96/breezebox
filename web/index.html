 if(!online||!state||state.calibrating||commandsPending||resetRequested)return;
 if(!await ask(t('resetT'),t('resetConfirm'),t('factoryReset'),'danger'))return;
 if(!online||!state||state.calibrating||commandsPending||resetRequested)return;
 resetRequested=true;resetNote='';commandEpoch++;commandsPending++;paint();
 try {
  const next=await request({op:'factory_reset',confirm:state.mac});
  if(!next.reset_pending)throw Error('reset_not_accepted');
  resetNote='resetAccepted';
 } catch(e) {
  resetRequested=false;resetNote='resetUncertain';toast(t('resetUncertain'),true);
 } finally {commandsPending--;paint();}
}
const busyGuard=()=>{if(!live()){toast(t('offline'),true);return true}if(state.calibrating){toast(t('busy'),true);return true}return false};
const A={
 go:e=>{ui.tab=e.dataset.v;paint();scrollTo(0,0)},
 power:()=>{if(live())send({op:'enable',value:!state.config.enabled})},
 mode:async e=>{if(busyGuard())return;const a=e.dataset.m==='1',c=state.config;if(a===c.automatic)return;if(a&&!valid()&&!c.prompt_seen)return firstPrompt(true);
  await send({op:'auto',value:a})},
 preset:e=>{if(busyGuard())return;const v=+e.dataset.v;let unit=state.config.manual_unit&&valid()?1:0,value=unit?Math.round(rpmFor(v)/25)*25:v;if(unit&&value<=0){unit=0;value=v}manualDirty=false;send({op:'manual',unit,value})},
 custom:()=>{if(customHeld){customHeld=false;return}if(busyGuard())return;const c=state.config;if(!c.custom)return toast(t('customHint'));manualDirty=false;send({op:'manual',value:c.custom,unit:c.custom_unit})},
 swap:()=>{if(!live()||state.calibrating)return;if(!valid()){if(state.config.enabled)toast(t('needCal'));return}const c=state.config;
  if(!state.config.enabled){ui.unit=ui.unit?0:1;dkey='';paint();return}
  if(manualMode()){const u=c.manual_unit?0:1,v=u?clamp(Math.round(rpmFor(c.manual)/25)*25,0,maxR()):Math.max(1,Math.round(pwmFor(c.manual)));manualDirty=false;send({op:'manual',unit:u,value:v})}
  else ui.unit=ui.unit?0:1;dkey='';paint()},
 reconnect:()=>{retryBusy=true;paint();clearTimeout(pollTimer);if(!polling)poll()},
 cu:e=>{ui.cu=+e.dataset.v;paint()},
 nsel:e=>{ui.node=e.dataset.i!=null?+e.dataset.i:clamp(ui.node+ +e.dataset.v,0,draft.points.length-1);renderCurve()},
 addPt:()=>{const points=insertPoint(draft.points);if(!points)return toast(t('noRoom'),true);const old=draft.points;draft.points=points;ui.node=Math.max(0,points.findIndex(p=>!old.some(o=>o[0]===p[0])));dirty=true;renderCurve()},
 del:()=>{if(draft.points.length<=2)return;draft.points.splice(ui.node,1);ui.node=Math.min(ui.node,draft.points.length-1);dirty=true;renderCurve()},
 undo:()=>{loadDraft();toast('');paint()},
 saveCurve:async()=>{if(busyGuard())return;const points=draft.points.map(p=>[...p]).sort((a,b)=>a[0]-b[0]);const error=curveError(points,100);if(error)return toast(t(error),true);if(await send({op:'config',config:{curve_unit:0,points}}))loadDraft();paint()},
 calStart:async()=>{if(busyGuard())return;if(await ask(t('confirmCalT'),t('confirmCal'),t('startCal')))send({op:'calibrate'})},
 cancelCal:()=>{send({op:'cancel'})},
 rename:()=>{if(busyGuard())return;dlg({title:t('deviceName'),body:`<div class="field"><input id="nameIn" maxlength="20" autocomplete="off" value="${esc(state.name||'')}"><span class="cnt" id="nameCnt"></span></div><p class="note">${t('nameNote')}</p>`,btns:[[t('cancel'),'',()=>closeDlg()],[t('renameDevice'),'primary',()=>{const v=$('nameIn').value.trim();if(!v||Array.from(v).length>20||new TextEncoder().encode(v).length>63)return toast(t('rejected'),true);closeDlg();send({op:'rename',name:v})}]],mount:()=>{const i=$('nameIn'),f=()=>$('nameCnt').textContent=Array.from(i.value).length+'/20';i.oninput=f;f();i.onkeydown=e=>{if(e.key==='Enter')dl.btns[1][2]()};setTimeout(()=>i.focus(),50)}})},
 langDlg:()=>{if(busyGuard())return;const c=state.config;dlg({title:t('language'),body:`<div class="opts">${opt('中文',!c.english,'setLang',0)}${opt('English',c.english,'setLang',1)}</div><p class="note">${t('languageHelp')}</p>`})},
 setLang:async e=>{const en=e.dataset.v==='1';closeDlg();if(en===state.config.english)return;if(await ask(t('langT'),t('languageHelp'),t('restart')))if(await send({op:'config',config:{english:en}}))beginReboot()},
 powerDlg:()=>{if(busyGuard())return;const p=state.config.power;dlg({title:t('power'),body:`<div class="opts">${[['restore','restoreS'],['off','offS2'],['autoPower','autoPowerS']].map(([k,s],i)=>opt(t(k),p===i,'setPower',i,t(s))).join('')}</div><p class="note">${t('powerNote')}</p>`})},
 setPower:e=>{closeDlg();const v=+e.dataset.v;if(v!==state.config.power)send({op:'config',config:{power:v}})},
 themeDlg:()=>dlg({title:t('appearance'),body:`<div class="opts">${['sys','light','dark'].map(k=>opt(t(k),theme===k,'setTheme',k)).join('')}</div><p class="note">${t('appNote')}</p>`}),
 setTheme:e=>{theme=e.dataset.v;closeDlg();applyTheme()},
 ota:()=>{if(busyGuard())return;dlg({title:t('update'),body:`<p>${t('updateHelp')}</p><label class="file">${ic('download',20)}<span id="fName">${t('chooseFile')}</span><input type="file" id="fIn" accept=".bin"></label><div id="otaP" hidden style="margin-top:16px"><div class="pbar"><i id="otaBar" style="width:0"></i></div><p class="note" id="otaT"></p></div>`,btns:[[t('cancel'),'',()=>closeDlg()],[t('upload'),'primary',()=>otaGo()]],mount:()=>{const b=$('dlgBtns').lastChild;b.disabled=true;$('fIn').onchange=e=>{const f=e.target.files[0];$('fName').textContent=f?f.name:t('chooseFile');b.disabled=!f}}})},
 reset:()=>requestFactoryReset(),
 dbtn:e=>dl.btns[+e.dataset.i][2](),
 close:()=>closeDlg()};
function otaGo(){
 const file=$('fIn').files[0];if(!file||uploading)return;if(busyGuard())return;
 const form=new FormData(),xhr=new XMLHttpRequest();form.append('update',file,file.name);
 uploading=true;dl.lock=true;$('dlgBtns').hidden=true;$('otaP').hidden=false;$('otaT').textContent=t('uploading')+' 0%';let sent=false;
 const finish=(ok,msg)=>{uploading=false;if(dl)dl.lock=false;if(ok){closeDlg(true);beginReboot('updated')}else{closeDlg(true);toast(t(msg),true)}};
 xhr.upload.onprogress=e=>{if(!e.lengthComputable)return;const p=Math.min(100,Math.round(e.loaded/e.total*100));$('otaBar').style.width=p+'%';$('otaT').textContent=`${t('uploading')} ${p}%`};
 xhr.upload.onload=()=>{sent=true;$('otaBar').style.width='100%';$('otaT').textContent=t('installing')};
 xhr.onload=()=>finish(xhr.status===200&&/Successful/.test(xhr.responseText),'updateFailed');
 xhr.onerror=xhr.ontimeout=()=>sent?(uploading=false,dl&&(dl.lock=false),closeDlg(true),beginReboot('unconfirmed')):finish(false,'uploadFailed');
 xhr.open('POST','/update');xhr.send(form);
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;A[el.dataset.a]?.(el,e)});
let customTimer=null,customHeld=false;
document.addEventListener('pointerdown',e=>{if(e.button!==0||!e.target.closest('[data-a=custom]'))return;customHeld=false;customTimer=setTimeout(()=>{customHeld=true;if(busyGuard())return;const save=enabledNow()&&manual.value>0;if(!save&&!state.config.custom)return toast(t('customOff'));send({op:'custom',value:save?manual.value:0,unit:save?effUnit():0}).then(ok=>{if(ok)toast(t(save?'customSaved':'customCleared'))})},600)});
const stopCustom=()=>{clearTimeout(customTimer);customTimer=null};addEventListener('pointerup',stopCustom);addEventListener('pointercancel',stopCustom);addEventListener('blur',stopCustom);
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-a=custom]'))e.preventDefault()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dl)closeDlg();const tb=e.target.closest?.('.tab');if(tb&&(e.key==='ArrowRight'||e.key==='ArrowLeft'||e.key==='Home'||e.key==='End')){const i=TABS.findIndex(x=>x[0]===tb.dataset.v),n=TABS[e.key==='Home'?0:e.key==='End'?3:(i+(e.key==='ArrowRight'?1:3))%4][0];e.preventDefault();ui.tab=n;paint();document.querySelector(`.tab[data-v=${n}]`).focus()}});
/* hold-to-repeat for -/+ */
let hT=null,hI=null,hDirty=0;const stopHold=()=>{clearTimeout(hT);clearInterval(hI);hT=hI=null;if(hDirty===1)applyManual();hDirty=0};
function hold(k,dv){if(k==='d'){if(!live())return false;if(state.calibrating){toast(t('busy'),true);return false}if(!manualMode()){toast(t('autoLocked'));return false}
  const u=effUnit(),st=u?25:1,mx=u?maxR():100,cur=enabledNow()?manual.value:0,v=clamp(Math.round(cur/st)*st+dv*st,0,mx);if(v===cur)return false;
  manual.unit=u;manual.value=v;manualDirty=true;manualRevision++;hDirty=1;paint();return true}
 if(!live()||state.calibrating)return false;const D=draft.points,n=D[ui.node],t0=n[0],o0=n[1];
 if(k==='t')moveNode(D,ui.node,n[0]+dv,n[1]);else if(cuOn()){const r=displayCalRpm(rpmFor(n[1]))+dv*50;moveNode(D,ui.node,n[0],r<=0?0:clamp(Math.round(pwmFor(r)*10)/10,0,100))}else moveNode(D,ui.node,n[0],Math.round(n[1])+dv);
 if(n[0]===t0&&n[1]===o0)return false;dirty=true;renderCurve();return true}
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-hold]');if(!el||el.disabled)return;e.preventDefault();stopHold();const [k,dv]=el.dataset.hold.split(':'),f=()=>{if(!hold(k,+dv)){clearInterval(hI);hI=null}};f();hT=setTimeout(()=>{hI=setInterval(f,60)},380)});
addEventListener('pointerup',stopHold);addEventListener('pointercancel',stopHold);addEventListener('blur',stopHold);
let rzT;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(paint,80)});
/* ---- polling ---- */
async function poll(){const epoch=commandEpoch;polling=true;try{if(!commandsPending&&!uploading){const next=await request();if(epoch===commandEpoch&&!commandsPending)render(next);}retryBusy=false;}catch(e){if(epoch!==commandEpoch||commandsPending)return;online=false;if(rebooting)rebooting.sawOffline=true;retryBusy=false;paint();}finally{polling=false;pollTimer=setTimeout(poll,1500);}}
buildDial();bindDial();bindGraph();translate();applyTheme();requestAnimationFrame(frame);poll();
</script></body></html>
